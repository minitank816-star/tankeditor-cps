<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TANKEDITOR: BATTLE LEGENDS V2</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#06090b;
  color:#fff;
  font-family:Arial,sans-serif;
}

button{
  font:inherit;
  border:0;
  color:inherit;
}

.screen{
  position:absolute;
  inset:0;
  display:none;
}

.screen.active{
  display:flex;
}

#menu{
  align-items:center;
  justify-content:center;
  text-align:center;
  background:
    radial-gradient(circle at 50% 35%,#304347,#111b1e 35%,#050708 80%);
}

.menu{
  width:min(520px,94vw);
  padding:28px;
  border:1px solid #43585b;
  border-radius:20px;
  background:#0b1316ee;
  box-shadow:0 25px 80px #000c;
}

.logo{
  font-size:clamp(38px,9vw,72px);
  line-height:.9;
  font-weight:1000;
  letter-spacing:2px;
}

.logo span{
  color:#e5b735;
}

.subtitle{
  margin:12px 0 25px;
  color:#9eacad;
  letter-spacing:2px;
}

.btn{
  width:100%;
  margin:6px 0;
  padding:14px;
  border-radius:11px;
  background:#26373a;
  border:1px solid #45595c;
  font-weight:900;
}

.primary{
  background:linear-gradient(#e9bd45,#8b691b);
  color:#111;
}

.btn:active{
  transform:scale(.98);
}

.small{
  color:#849497;
  font-size:12px;
}

/* GARAGE */

#garage{
  flex-direction:column;
  padding:16px;
  background:linear-gradient(145deg,#071013,#172225);
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.back{
  padding:10px 13px;
  border-radius:9px;
  background:#27383b;
}

.title{
  font-size:25px;
  font-weight:1000;
}

.money{
  padding:9px 12px;
  border-radius:9px;
  background:#1b292c;
  color:#ffd64d;
  font-weight:900;
}

.tankGrid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;
  overflow:auto;
  margin-top:15px;
  padding-bottom:20px;
}

.tankCard{
  padding:12px;
  border-radius:14px;
  background:#0d181a;
  border:1px solid #35484b;
}

.tankIcon{
  height:100px;
  display:grid;
  place-items:center;
}

.tankIcon canvas{
  width:130px;
  height:90px;
}

.tankStats{
  color:#9eadaf;
  font-size:12px;
  line-height:1.5;
  margin:6px 0 10px;
}

.tankCard button{
  width:100%;
  padding:9px;
  border-radius:9px;
  background:#293c3f;
  font-weight:900;
}

.owned{
  background:#315e42!important;
}

.selected{
  background:#d9aa32!important;
  color:#111;
}

/* BATTLE */

#battle{
  background:#20281f;
  overflow:hidden;
}

#gameCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  touch-action:none;
}

#hud{
  position:absolute;
  z-index:5;
  top:8px;
  left:8px;
  right:8px;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
}

.hudBox{
  padding:8px 11px;
  border-radius:9px;
  border:1px solid #47595c;
  background:#071012dd;
  font-size:12px;
}

#controls{
  position:absolute;
  z-index:6;
  left:14px;
  right:14px;
  bottom:14px;
  display:flex;
  justify-content:space-between;
  align-items:end;
  pointer-events:none;
}

#joystick{
  width:125px;
  height:125px;
  border-radius:50%;
  background:#071012aa;
  border:2px solid #667477;
  position:relative;
  pointer-events:auto;
  touch-action:none;
}

#stick{
  position:absolute;
  width:52px;
  height:52px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:#b6c0c0;
  opacity:.8;
}

#fire{
  width:82px;
  height:82px;
  border-radius:50%;
  background:#8d241d;
  border:2px solid #df6254;
  font-weight:1000;
  pointer-events:auto;
  touch-action:none;
}

#fire:active{
  transform:scale(.94);
}

#result{
  position:absolute;
  z-index:20;
  left:50%;
  top:48%;
  transform:translate(-50%,-50%);
  width:min(390px,90vw);
  padding:23px;
  text-align:center;
  border:1px solid #45595c;
  border-radius:17px;
  background:#0b1417f7;
  box-shadow:0 25px 70px #000d;
}

.resultTitle{
  font-size:32px;
  font-weight:1000;
}

.hidden{
  display:none!important;
}

@media(max-width:500px){
  #joystick{
    width:110px;
    height:110px;
  }

  #fire{
    width:76px;
    height:76px;
  }
}
</style>
</head>

<body>

<div id="app">

<!-- MENU -->
<section id="menu" class="screen active">
  <div class="menu">

    <div class="logo">
      TANKEDITOR<br>
      <span>BATTLE LEGENDS</span>
    </div>

    <div class="subtitle">
      V2 • ARMORED COMBAT
    </div>

    <button class="btn primary" id="startBtn">
      START BATTLE
    </button>

    <button class="btn" id="garageBtn">
      GARAGE
    </button>

    <button class="btn" id="resetBtn">
      RESET SAVE
    </button>

    <p class="small">
      Made by TankEditor
    </p>

  </div>
</section>


<!-- GARAGE -->
<section id="garage" class="screen">

  <div class="topbar">

    <button class="back" id="backBtn">
      ← MENU
    </button>

    <div class="title">
      GARAGE
    </div>

    <div class="money">
      🪙 <span id="garageCoins">0</span>
    </div>

  </div>

  <div class="small" id="factionText"></div>

  <div class="tankGrid" id="tankGrid"></div>

</section>


<!-- BATTLE -->
<section id="battle" class="screen">

  <canvas id="gameCanvas"></canvas>

  <div id="hud">

    <div class="hudBox">
      MISSION <b id="mission">1</b>
    </div>

    <div class="hudBox">
      ❤️ <b id="hpText">100</b>
      &nbsp; 🪙 <b id="battleCoins">0</b>
    </div>

  </div>


  <div id="controls">

    <div id="joystick">
      <div id="stick"></div>
    </div>

    <button id="fire">
      FIRE<br>💥
    </button>

  </div>


  <div id="result" class="hidden">

    <div class="resultTitle" id="resultTitle"></div>

    <p id="resultText"></p>

    <button class="btn primary" id="continueBtn">
      CONTINUE
    </button>

    <button class="btn" id="resultMenuBtn">
      MENU
    </button>

  </div>

</section>

</div>


<script>
"use strict";

/* =========================================================
   DATA
========================================================= */

const TANKS = [

  {
    id:"scout",
    name:"SCOUT",
    price:0,
    hp:120,
    damage:25,
    speed:220,
    reload:380,
    armor:5,
    scale:1
  },

  {
    id:"crusher",
    name:"CRUSHER",
    price:300,
    hp:170,
    damage:34,
    speed:185,
    reload:450,
    armor:9,
    scale:1.08
  },

  {
    id:"titan",
    name:"TITAN",
    price:750,
    hp:240,
    damage:48,
    speed:155,
    reload:520,
    armor:14,
    scale:1.18
  },

  {
    id:"legend",
    name:"LEGEND",
    price:1500,
    hp:320,
    damage:65,
    speed:145,
    reload:600,
    armor:20,
    scale:1.28
  }

];


const DEFAULT_SAVE = {

  coins:500,

  level:1,

  country:null,

  owned:["scout"],

  selected:"scout",

  upgrades:{}

};


let save;

let game=null;

let animationId=null;

let enemyTimer=null;


/* =========================================================
   DOM
========================================================= */

const $ = id => document.getElementById(id);

const canvas=$("gameCanvas");

const ctx=canvas.getContext("2d");


/* =========================================================
   SAVE
========================================================= */

function loadSave(){

  try{

    const raw=
      localStorage.getItem(
        "TANKEDITOR_BATTLE_LEGENDS_V2"
      );

    if(!raw){

      return {
        ...DEFAULT_SAVE,
        owned:["scout"],
        upgrades:{}
      };

    }

    const data=JSON.parse(raw);

    return {

      ...DEFAULT_SAVE,

      ...data,

      owned:
        Array.isArray(data.owned)
        ? data.owned
        : ["scout"],

      upgrades:
        data.upgrades || {}

    };

  }catch(e){

    return {
      ...DEFAULT_SAVE,
      owned:["scout"],
      upgrades:{}
    };

  }

}


function saveGame(){

  localStorage.setItem(
    "TANKEDITOR_BATTLE_LEGENDS_V2",
    JSON.stringify(save)
  );

}


/* =========================================================
   SCREEN
========================================================= */

function showScreen(id){

  document
    .querySelectorAll(".screen")
    .forEach(s=>s.classList.remove("active"));

  $(id).classList.add("active");

}


/* =========================================================
   TANK
========================================================= */

function getTank(){

  return TANKS.find(
    t=>t.id===save.selected
  ) || TANKS[0];

}


function getUpgradeLevel(id){

  return Number(
    save.upgrades[id] || 0
  );

}


function getTankStats(tank){

  const upgrade=
    getUpgradeLevel(tank.id);

  return {

    hp:
      tank.hp+
      upgrade*18,

    damage:
      tank.damage+
      upgrade*4,

    speed:
      tank.speed+
      upgrade*5,

    armor:
      tank.armor+
      upgrade*2,

    reload:
      Math.max(
        180,
        tank.reload-
        upgrade*18
      )

  };

}


/* =========================================================
   GARAGE
========================================================= */

function drawMiniTank(canvas,tank){

  const c=canvas.getContext("2d");

  c.clearRect(0,0,canvas.width,canvas.height);

  c.save();

  c.translate(
    canvas.width/2,
    canvas.height/2
  );

  c.fillStyle="#151b1b";

  c.fillRect(
    -52,
    -28,
    104,
    56
  );

  c.fillStyle="#252e2d";

  c.fillRect(
    -43,
    -22,
    86,
    44
  );

  c.fillStyle="#58635d";

  c.fillRect(
    -22,
    -19,
    44,
    32
  );

  c.fillStyle="#6d7770";

  c.fillRect(
    -15,
    -15,
    30,
    24
  );

  c.fillStyle="#777";

  c.fillRect(
    8,
    -5,
    55,
    10
  );

  c.fillStyle="#090b0b";

  c.fillRect(
    -58,
    -30,
    14,
    60
  );

  c.fillRect(
    44,
    -30,
    14,
    60
  );

  c.restore();

}


function renderGarage(){

  $("garageCoins").textContent=
    save.coins;

  $("factionText").textContent=
    save.country
    ? "Faction: "+save.country
    : "Faction: none";


  $("tankGrid").innerHTML=
    TANKS.map(t=>{

      const owned=
        save.owned.includes(t.id);

      const selected=
        save.selected===t.id;

      const stats=
        getTankStats(t);

      let label;

      if(selected)
        label="SELECTED";
      else if(owned)
        label="SELECT";
      else
        label="🪙 "+t.price;


      return `

        <div class="tankCard">

          <div class="tankIcon">
            <canvas
              width="180"
              height="100"
              data-mini="${t.id}">
            </canvas>
          </div>

          <b>${t.name}</b>

          <div class="tankStats">
            HP: ${stats.hp}<br>
            DAMAGE: ${stats.damage}<br>
            SPEED: ${Math.round(stats.speed)}<br>
            ARMOR: ${stats.armor}<br>
            LEVEL: ${getUpgradeLevel(t.id)}
          </div>

          <button
            data-tank="${t.id}"
            class="${
              selected
              ?"selected"
              :owned
              ?"owned"
              :""
            }">

            ${label}

          </button>

        </div>

      `;

    }).join("");


  TANKS.forEach(t=>{

    const mini=
      document.querySelector(
        `[data-mini="${t.id}"]`
      );

    if(mini)
      drawMiniTank(mini,t);

  });


  document
    .querySelectorAll("[data-tank]")
    .forEach(button=>{

      button.onclick=()=>{

        const tank=
          TANKS.find(
            t=>t.id===button.dataset.tank
          );

        if(!tank)return;


        if(save.owned.includes(tank.id)){

          save.selected=tank.id;

          saveGame();

          renderGarage();

          return;

        }


        if(save.coins>=tank.price){

          save.coins-=tank.price;

          save.owned.push(tank.id);

          save.selected=tank.id;

          saveGame();

          renderGarage();

        }

      };

    });

}


/* =========================================================
   CANVAS RESIZE
========================================================= */

function resizeCanvas(){

  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;

}

window.addEventListener(
  "resize",
  resizeCanvas
);

resizeCanvas();


/* =========================================================
   MAP
========================================================= */

function createMap(){

  const obstacles=[];

  const w=canvas.width;
  const h=canvas.height;

  for(let i=0;i<10;i++){

    const width=
      60+
      Math.random()*100;

    const height=
      35+
      Math.random()*65;

    obstacles.push({

      x:
        30+
        Math.random()*
        Math.max(1,w-width-60),

      y:
        80+
        Math.random()*
        Math.max(1,h-250),

      w:width,

      h:height

    });

  }

  return obstacles;

}


/* =========================================================
   BATTLE START
========================================================= */

function startBattle(){

  const tank=getTank();

  const stats=getTankStats(tank);

  if(!save.country){

    showScreen("garage");

    return;

  }


  game={

    width:canvas.width,

    height:canvas.height,

    player:{

      x:canvas.width/2,

      y:canvas.height-180,

      angle:-Math.PI/2,

      hp:stats.hp,

      maxHp:stats.hp,

      damage:stats.damage,

      speed:stats.speed,

      armor:stats.armor,

      reload:stats.reload,

      lastShot:0

    },

    enemy:{

      x:canvas.width/2,

      y:130,

      angle:Math.PI/2,

      hp:
        100+
        save.level*35,

      maxHp:
        100+
        save.level*35,

      speed:
        75+
        save.level*3,

      lastShot:0,

      reload:
        Math.max(
          700-
          save.level*8,
          360
        )

    },

    bullets:[],

    particles:[],

    obstacles:createMap(),

    keys:{},

    joyX:0,

    joyY:0,

    over:false

  };


  $("mission").textContent=
    save.level;

  $("battleCoins").textContent=
    save.coins;

  $("result").classList.add(
    "hidden"
  );


  showScreen("battle");


  cancelAnimationFrame(
    animationId
  );

  loop(
    performance.now()
  );

}


/* =========================================================
   INPUT
========================================================= */

window.addEventListener(
  "keydown",
  e=>{

    if(!game)return;

    game.keys[e.key.toLowerCase()]=true;

    if(e.code==="Space")
      shootPlayer();

  }
);


window.addEventListener(
  "keyup",
  e=>{

    if(!game)return;

    game.keys[e.key.toLowerCase()]=false;

  }
);


/* =========================================================
   JOYSTICK
========================================================= */

const joystick=$("joystick");

const stick=$("stick");

let joystickActive=false;


function joystickMove(clientX,clientY){

  const r=
    joystick.getBoundingClientRect();

  const cx=
    r.left+r.width/2;

  const cy=
    r.top+r.height/2;

  let dx=clientX-cx;

  let dy=clientY-cy;

  const max=r.width*.34;

  const len=Math.hypot(dx,dy);

  if(len>max){

    dx=
      dx/len*max;

    dy=
      dy/len*max;

  }


  stick.style.left=
    `calc(50% + ${dx}px)`;

  stick.style.top=
    `calc(50% + ${dy}px)`;


  if(game){

    game.joyX=
      dx/max;

    game.joyY=
      dy/max;

  }

}


function joystickEnd(){

  joystickActive=false;

  stick.style.left="50%";

  stick.style.top="50%";

  if(game){

    game.joyX=0;

    game.joyY=0;

  }

}


joystick.addEventListener(
  "pointerdown",
  e=>{

    joystickActive=true;

    joystick.setPointerCapture(
      e.pointerId
    );

    joystickMove(
      e.clientX,
      e.clientY
    );

  }
);


joystick.addEventListener(
  "pointermove",
  e=>{

    if(joystickActive)
      joystickMove(
        e.clientX,
        e.clientY
      );

  }
);


joystick.addEventListener(
  "pointerup",
  joystickEnd
);


joystick.addEventListener(
  "pointercancel",
  joystickEnd
);


/* =========================================================
   FIRE BUTTON
========================================================= */

$("fire").addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    shootPlayer();

  }
);


/* =========================================================
   MOVEMENT
========================================================= */

function movePlayer(dt){

  const p=game.player;

  let x=0;
  let y=0;


  if(game.keys["w"] ||
     game.keys["arrowup"])
    y-=1;

  if(game.keys["s"] ||
     game.keys["arrowdown"])
    y+=1;

  if(game.keys["a"] ||
     game.keys["arrowleft"])
    x-=1;

  if(game.keys["d"] ||
     game.keys["arrowright"])
    x+=1;


  x+=game.joyX;

  y+=game.joyY;


  const length=
    Math.hypot(x,y);


  if(length>1){

    x/=length;
    y/=length;

  }


  if(length>.05){

    p.angle=
      Math.atan2(y,x);

    const nx=
      p.x+
      x*p.speed*dt;

    const ny=
      p.y+
      y*p.speed*dt;


    if(!collidesTank(
      nx,
      ny,
      25
    )){

      p.x=nx;
      p.y=ny;

    }

  }


  p.x=
    Math.max(
      30,
      Math.min(
        canvas.width-30,
        p.x
      )
    );

  p.y=
    Math.max(
      70,
      Math.min(
        canvas.height-40,
        p.y
      )
    );

}


/* =========================================================
   COLLISION
========================================================= */

function collidesTank(x,y,r){

  for(const o of game.obstacles){

    if(
      x+r>o.x &&
      x-r<o.x+o.w &&
      y+r>o.y &&
      y-r<o.y+o.h
    ){

      return true;

    }

  }

  return false;

}


/* =========================================================
   SHOOTING
========================================================= */

function shootPlayer(){

  if(!game || game.over)
    return;


  const p=game.player;

  const now=performance.now();


  if(
    now-p.lastShot<
    p.reload
  )
    return;


  p.lastShot=now;


  createBullet(

    p.x+
      Math.cos(p.angle)*42,

    p.y+
      Math.sin(p.angle)*42,

    p.angle,

    true,

    p.damage

  );

}


/* =========================================================
   BULLET
========================================================= */

function createBullet(
  x,
  y,
  angle,
  player,
  damage
){

  game.bullets.push({

    x,

    y,

    angle,

    speed:
      player
      ? 620
      : 430,

    player,

    damage,

    life:1.8

  });

}


function updateBullets(dt){

  for(
    let i=game.bullets.length-1;
    i>=0;
    i--
  ){

    const b=game.bullets[i];

    b.x+=
      Math.cos(b.angle)*
      b.speed*
      dt;

    b.y+=
      Math.sin(b.angle)*
      b.speed*
      dt;

    b.life-=dt;


    if(b.life<=0){

      game.bullets.splice(i,1);

      continue;

    }


    let remove=false;


    for(const o of game.obstacles){

      if(
        b.x>o.x &&
        b.x<o.x+o.w &&
        b.y>o.y &&
        b.y<o.y+o.h
      ){

        explosion(
          b.x,
          b.y,
          false
        );

        remove=true;

        break;

      }

    }


    if(remove){

      game.bullets.splice(i,1);

      continue;

    }


    if(b.player){

      const e=game.enemy;

      if(
        Math.hypot(
          b.x-e.x,
          b.y-e.y
        )<30
      ){

        const damage=
          Math.max(
            5,
            b.damage
          );

        e.hp=
          Math.max(
            0,
            e.hp-damage
          );

        explosion(
          b.x,
          b.y,
          true
        );

        game.bullets.splice(i,1);

        if(e.hp<=0)
          victory();

      }

    }else{

      const p=game.player;

      if(
        Math.hypot(
          b.x-p.x,
          b.y-p.y
        )<27
      ){

        const damage=
          Math.max(
            4,
            b.damage-p.armor
          );

        p.hp=
          Math.max(
            0,
            p.hp-damage
          );

        explosion(
          b.x,
          b.y
