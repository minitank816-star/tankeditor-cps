<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TankEditor CPS Tester</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&display=swap');

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #172554 0%, #080b16 45%, #03040a 100%);
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 20px;
}

.app {
    width: 100%;
    max-width: 430px;
}

/* HEADER */

.logo {
    text-align: center;
    font-family: Orbitron, sans-serif;
    font-size: 25px;
    font-weight: 800;
    letter-spacing: 3px;
    margin-top: 15px;
    color: #60a5fa;
}

.subtitle {
    text-align: center;
    color: #64748b;
    font-size: 11px;
    letter-spacing: 3px;
    margin: 7px 0 25px;
}

/* MAIN PANEL */

.panel {
    background: rgba(15, 23, 42, 0.88);
    border: 1px solid #1e3a5f;
    border-radius: 22px;
    padding: 20px;
    box-shadow: 0 0 40px rgba(37, 99, 235, 0.12);
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
}

.stat {
    background: #080f1d;
    border: 1px solid #1e293b;
    border-radius: 14px;
    padding: 15px;
    text-align: center;
}

.stat-label {
    color: #64748b;
    font-size: 10px;
    letter-spacing: 1.5px;
    margin-bottom: 8px;
}

.stat-value {
    font-family: Orbitron, sans-serif;
    font-size: 23px;
    font-weight: 700;
    color: #e0f2fe;
}

#timer {
    color: #fbbf24;
}

/* CLICK AREA */

.click-area {
    height: 260px;
    border-radius: 20px;
    border: 2px solid #2563eb;
    background: linear-gradient(145deg, #172554, #0f172a);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    cursor: pointer;
    user-select: none;
    touch-action: manipulation;
    transition: transform 0.08s, background 0.08s;
    box-shadow:
        inset 0 0 30px rgba(37, 99, 235, 0.08),
        0 0 20px rgba(37, 99, 235, 0.08);
}

.click-area:active {
    transform: scale(0.96);
    background: #1d4ed8;
}

.click-area.disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

.click-text {
    font-family: Orbitron, sans-serif;
    font-size: 25px;
    font-weight: 800;
    letter-spacing: 2px;
}

.click-hint {
    color: #94a3b8;
    font-size: 12px;
    margin-top: 10px;
}

/* BUTTONS */

.controls {
    margin-top: 18px;
}

button {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    background: #2563eb;
    color: white;
    font-family: Orbitron, sans-serif;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    touch-action: manipulation;
}

button:active {
    transform: scale(0.98);
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

/* RESULTS */

.result {
    text-align: center;
    margin-top: 20px;
    color: #94a3b8;
    font-size: 13px;
}

.result strong {
    color: #60a5fa;
    font-size: 20px;
}

/* YOUTUBE */

.youtube-button {
    display: block;
    width: 100%;
    margin-top: 20px;
    padding: 15px;
    border-radius: 12px;
    background: #dc2626;
    color: white;
    text-align: center;
    text-decoration: none;
    font-family: Orbitron, sans-serif;
    font-weight: 700;
    letter-spacing: 1px;
    transition: 0.15s;
}

.youtube-button:active {
    transform: scale(0.97);
    background: #b91c1c;
}

/* FOOTER */

.footer {
    text-align: center;
    color: #475569;
    font-size: 10px;
    margin-top: 22px;
    letter-spacing: 1.5px;
}

.footer span {
    color: #60a5fa;
}
</style>
</head>

<body>

<div class="app">

    <!-- APP BRANDING -->

    <div class="logo">⚡ TANKEDITOR CPS</div>

    <div class="subtitle">
        CLICK SPEED TEST
    </div>


    <div class="panel">

        <!-- STATS -->

        <div class="stats">

            <div class="stat">
                <div class="stat-label">
                    TIME LEFT
                </div>

                <div class="stat-value" id="timer">
                    10.0
                </div>
            </div>


            <div class="stat">
                <div class="stat-label">
                    CURRENT CPS
                </div>

                <div class="stat-value" id="cps">
                    0.00
                </div>
            </div>

        </div>


        <!-- CLICK AREA -->

        <div
            class="click-area disabled"
            id="clickArea"
        >

            <div>

                <div
                    class="click-text"
                    id="clickText"
                >
                    PRESS START
                </div>

                <div class="click-hint">
                    Tap as fast as you can
                </div>

            </div>

        </div>


        <!-- START BUTTON -->

        <div class="controls">

            <button id="startButton">
                START TEST
            </button>

        </div>


        <!-- RESULTS -->

        <div class="result">

            Total Clicks:
            <strong id="clicks">
                0
            </strong>

            <br><br>

            Best CPS:
            <strong id="best">
                0.00
            </strong>

        </div>


        <!-- YOUTUBE BUTTON -->

        <a
            class="youtube-button"
            href="https://youtube.com/@tankeditor1"
            target="_blank"
            rel="noopener noreferrer"
        >
            ▶ VISIT TANKEDITOR
        </a>

    </div>


    <!-- FOOTER -->

    <div class="footer">
        MADE BY <span>TANKEDITOR</span>
    </div>

</div>


<script>

/* GAME VARIABLES */

let clicks = 0;
let timeLeft = 10;
let running = false;
let startTime;
let timer;


/* LOAD BEST SCORE */

let best = localStorage.getItem("tankEditorBestCPS") || 0;


/* GET HTML ELEMENTS */

const clickArea =
    document.getElementById("clickArea");

const clickText =
    document.getElementById("clickText");

const startButton =
    document.getElementById("startButton");

const timerText =
    document.getElementById("timer");

const cpsText =
    document.getElementById("cps");

const clicksText =
    document.getElementById("clicks");

const bestText =
    document.getElementById("best");


/* SHOW SAVED BEST */

bestText.innerText =
    Number(best).toFixed(2);


/* START GAME */

startButton.onclick = function() {

    clicks = 0;

    timeLeft = 10;

    running = true;

    startTime = Date.now();


    clickArea.classList.remove("disabled");

    clickText.innerText = "CLICK!";

    startButton.disabled = true;


    clicksText.innerText = "0";

    cpsText.innerText = "0.00";

    timerText.innerText = "10.0";


    timer = setInterval(function() {

        let elapsed =
            (Date.now() - startTime) / 1000;


        timeLeft =
            Math.max(0, 10 - elapsed);


        timerText.innerText =
            timeLeft.toFixed(1);


        let cps =
            elapsed > 0
            ? clicks / elapsed
            : 0;


        cpsText.innerText =
            cps.toFixed(2);


        if (timeLeft <= 0) {

            endTest();

        }

    }, 50);

};


/* CLICK DETECTION */

clickArea.onclick = function() {

    if (!running) return;


    clicks++;


    clicksText.innerText =
        clicks;


    let elapsed =
        (Date.now() - startTime) / 1000;


    let cps =
        elapsed > 0
        ? clicks / elapsed
        : 0;


    cpsText.innerText =
        cps.toFixed(2);

};


/* END TEST */

function endTest() {

    clearInterval(timer);


    running = false;


    clickArea.classList.add("disabled");

    clickText.innerText =
        "TEST FINISHED";


    startButton.disabled =
        false;


    let finalCPS =
        clicks / 10;


    cpsText.innerText =
        finalCPS.toFixed(2);


    /* NEW BEST */

    if (finalCPS > best) {

        best = finalCPS;


        localStorage.setItem(
            "tankEditorBestCPS",
            best
        );


        bestText.innerText =
            Number(best).toFixed(2);

    }


    setTimeout(function() {

        alert(
            "TEST COMPLETE!\n\n" +
            "Clicks: " + clicks +
            "\nCPS: " + finalCPS.toFixed(2)
        );

    }, 100);

}

script>
<div style="text-align: center; color: #60a5fa; margin: 15px 0; font-family: sans-serif;">
  Total Visits: <span id="visit-count">Loading...</span>
</div>

<script>
  fetch('https://api.counterapi.dev/v1/tankeditor-cps/visits/up')
    .then(res => res.json())
    .then(data => {
      document.getElementById('visit-count').innerText = data.count;
    })
    .catch(() => {
      document.getElementById('visit-count').innerText = '1';
    });
</script><!-- Rating System -->
<div style="text-align: center; margin-top: 10px; font-family: sans-serif;">
  <p style="color: #ffffff; margin-bottom: </5px; font-size: 14px;">Rate this game:</p>
  <button onclick="rate(1)" style="background: none; border: none; font-size: 20px; cursor: pointer;">⭐</button>
  <button onclick="rate(2)" style="background: none; border: none; font-size: 20px; cursor: pointer;">⭐</button>
  <button onclick="rate(3)" style="background: none; border: none; font-size: 20px; cursor: pointer;">⭐</button>
  <button onclick="rate(4)" style="background: none; border: none; font-size: 20px; cursor: pointer;">⭐</button>
  <button onclick="rate(5)" style="background: none; border: none; font-size: 20px; cursor: pointer;">⭐</button>
  <div id="rating-status" style="font-size: 12px; color: #a0aec0; margin-top: 4px;"></div>
</div>
    
    
</body>
  </html>
